name: CI

on:
  push:
    branches:
      - master
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift (native rewrite — build, test)
    # The project's MACOSX_DEPLOYMENT_TARGET is 26.0 and it was built against
    # Xcode 26.6 locally; `latest-stable` below tracks whatever Xcode the
    # runner image currently ships as its newest release. If this job starts
    # failing to resolve a destination or to find the SDK, that mismatch —
    # not the app — is almost certainly why; pin an explicit version with
    # `maxim-lobanov/setup-xcode`'s `xcode-version:` input once one is known
    # to work on `macos-latest`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project Wikily/Wikily.xcodeproj \
            -scheme Wikily \
            -destination 'platform=macOS' \
            test
