name: release

# Replaces the old publish.yml, which published the Tauri prototype this app
# is replacing. See docs/RELEASING.md for how to trigger this, and
# docs/NATIVE_REWRITE_ROADMAP.md (item 3) for why the app is ad-hoc signed
# (no paid Apple Developer Program enrollment) and how Sparkle updates work
# around that.
#
# Push a tag matching v* (e.g. v1.2.0) to build, ad-hoc sign, and publish a
# GitHub Release, then regenerate appcast.xml and commit it to master so
# every installed copy of Wikily can find the new version via Sparkle.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.9.5" # keep in sync with the SPM package version in project.pbxproj

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch Sparkle CLI tools
        run: |
          curl -sL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools

      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive \
            -project Wikily/Wikily.xcodeproj \
            -scheme Wikily \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Wikily.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Ad-hoc sign and zip the app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="$RUNNER_TEMP/Wikily.xcarchive/Products/Applications/Wikily.app"
          # No Developer ID / Team ID, so `-exportArchive` (which expects a
          # provisioning/team association) doesn't apply — the archive's own
          # built app is extracted and re-signed directly instead.
          codesign --deep --force --sign - "$APP_PATH"
          # `ditto`, not `zip`: preserves resource forks/symlinks that a plain
          # zip can drop, which Sparkle's docs call out as breaking the
          # embedded framework's signature.
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/Wikily-$VERSION.app.zip"

      - name: Generate and sign the appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir "$RUNNER_TEMP/appcast_input"
          cp "$RUNNER_TEMP/Wikily-$VERSION.app.zip" "$RUNNER_TEMP/appcast_input/"
          # `generate_appcast` signs as part of building the appcast, so no
          # separate `sign_update` step is needed. Only this release's zip
          # needs to be present locally — Sparkle only needs the appcast to
          # contain something newer than whatever's currently installed, not
          # a full history of every past release.
          echo "$SPARKLE_PRIVATE_KEY" | ./sparkle-tools/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            -o "$RUNNER_TEMP/appcast_input/appcast.xml" \
            "$RUNNER_TEMP/appcast_input"

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/Wikily-$VERSION.app.zip" \
            --title "Wikily v$VERSION" \
            --notes "See the commit history for what changed. First time installing Wikily? See the README's Download section for the one-time right-click → Open step."

      - name: Update appcast.xml on master
        run: |
          cp "$RUNNER_TEMP/appcast_input/appcast.xml" appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Release v${{ steps.version.outputs.version }}: update appcast" || exit 0
          git push origin HEAD:master
